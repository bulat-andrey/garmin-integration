[project]
name = "garmin-recovery-local"
version = "0.1.0"
description = "Local Garmin Connect recovery analysis built on Codex + MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.1",
]

[project.scripts]
analyze-recovery = "garmin_recovery.cli:analyze_recovery_main"
analyze-week = "garmin_recovery.cli:analyze_week_main"
add-rpe = "garmin_recovery.cli:add_rpe_main"
analyze-kite-history = "garmin_recovery.cli:analyze_kite_history_main"
send-telegram-recovery = "garmin_recovery.cli:send_telegram_recovery_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_recovery"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
